# battle_test configuration for the smark_iq server (inside the Docker
# container). Selected by BATTLE_TEST_CONFIG, set in the Dockerfile. The laptop
# keeps using config.toml. See plans/server-migration-plan.md.

[ollama]
# Ollama runs natively on the server; containers reach the host this way.
url = "http://host.docker.internal:11434"
timeout_seconds = 1800
# The GPU is shared with smark_iq's Open WebUI (one 16 GB card). Unload the
# model 30 s after the last request: it stays loaded through a run, whose
# calls come back to back, and frees the card soon after (decided 2026-09-28,
# "option 1"; hosted models via Bedrock may replace this later).
keep_alive = "30s"

[models]
# "ollama" (models on this machine) or "bedrock" (hosted, see
# config.bedrock.toml and plans/aws-bedrock-plan.md).
provider = "ollama"
# Decided 2026-09-25: start with 14B (fits fully on the 16 GB GPU with a
# 12k context), then compare ~30B options with the evaluation.
plaintiff = "qwen2.5:14b"
defendant = "qwen2.5:14b"
# Checks, before drafting, whether each selected section fits the case, and
# afterwards whether each cited section says what the draft cites it for
# (plans/plan.md, 3a). On since 2026-10-15, after a look at a results page:
# about a minute more per case. Only "does not support" is marked inline.
# Leave it out to turn both checks off.
checker = "qwen2.5:14b"

[generation]
num_ctx = 12288
temperature = 0.4
# The checker's temperature, for both checks: 0 gives the same section the
# same verdict every time it's asked (the default, if left out).
checker_temperature = 0.0

[pipeline]
rounds = 2
# Command-line and evaluation output, inside the cases volume (privileged).
output_dir = "/data/cases/output"

[corpus]
snapshot = "v2026.09.1"
base_url = "https://oss-data-us.vaquill.ai"
# The battle-law volume.
data_dir = "/data/law"
jurisdictions = ["ut", "ca", "tx", "ak", "federal"]
document_types = ["statutes", "constitutions", "court_rules"]

[search]
# Semantic search alongside keyword search: on since 2026-10-16. The vectors
# are in the battle-law volume next to the index (/data/law/law-vectors*),
# and the weekly `corpus refresh` re-embeds only new and changed sections.
# If they're ever missing or behind the index, cases fall back to keyword
# search with a warning in the app log.
semantic = true
# Must be the model that built the vectors. Runs on the server's Ollama
# (the [ollama] url), next to the drafting model: 274 MB of the 16 GB card.
embedding_model = "nomic-embed-text"

[web]
# 0.0.0.0 inside the container. No port is published on the host: only Caddy,
# on smark_iq's Docker network, can reach it. Allowed only because
# behind_proxy and secure_cookies are both true.
host = "0.0.0.0"
port = 8000
# The battle-cases volume: accounts and case files.
data_dir = "/data/cases"
secure_cookies = true
behind_proxy = true
retention_days = 90
# How many cases one user may have waiting or running at once. Runs go one
# at a time, so this stops one person filling the queue. 0 = no cap.
max_active_cases = 3
# Where users reach the site, for the one-time setup links the admin command
# prints.
public_url = "https://battle.smarkiq.us"

[plans]
# The service packages accounts are sold (see plans/profitability-plan.md),
# as the number of cases an account may start. Set an account's plan with
# `python -m battle_test.web.users plan NAME PLAN`. Runs that fail aren't
# counted. An account with no plan, or one removed from here, gets `default`.
default = "trial"

[plans.trial]
label = "Trial"
cases = 5
period = "total"    # never renews

[plans.solo]
label = "Solo"
cases = 30
period = "month"    # renews on the 1st

[plans.pro]
label = "Pro"
cases = 100
period = "month"

[plans.firm]
label = "Firm"
cases = 60          # per seat. Seats in the same firm (users firm NAME FIRM) share the total.
period = "month"

[plans.unlimited]
label = "Unlimited"  # no "cases": no limit. For admins and internal testing.
