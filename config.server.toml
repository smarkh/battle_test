# battle_test configuration for the smark_iq server (inside the Docker
# container). Selected by BATTLE_TEST_CONFIG, set in the Dockerfile. The laptop
# keeps using config.toml. See plans/server-migration-plan.md.

[ollama]
# Ollama runs natively on the server; containers reach the host this way.
# Since the beta (2026-11-20) it runs only the search embedding model; the
# drafting and checking models are on Bedrock.
url = "http://host.docker.internal:11434"
timeout_seconds = 1800
# The GPU is shared with smark_iq's Open WebUI (one 16 GB card). Unload a
# model 30 s after the last request (decided 2026-09-28, "option 1").
keep_alive = "30s"

[models]
# "ollama" (models on this machine) or "bedrock" (hosted).
# Decided 2026-11-20, for the lawyers' beta: gpt-oss 120B on Bedrock for
# drafting and both checks. It cited 58-65% of core law with 0 off-topic in
# the evaluations, against about 43% for the server's 14B, at about $0.05 a
# case (plans/beta-plan.md). Fictional cases only, until the lawyer agrees to
# case material going to AWS.
#
# Needs the Bedrock API key in secrets/bedrock_api_key on the server before
# deploying (docs/running-on-server.md, "Bedrock API key").
#
# To go back to the server's GPU: provider = "ollama", all three models
# "qwen2.5:14b", and workers = 1 under [web].
provider = "bedrock"
plaintiff = "gpt-oss-120b"
defendant = "gpt-oss-120b"
# Checks, before drafting, whether each selected section fits the case, and
# afterwards whether each cited section says what the draft cites it for
# (plans/plan.md, 3a). Only "does not support" is marked inline. Leave it out
# to turn both checks off.
checker = "gpt-oss-120b"

[generation]
num_ctx = 12288         # Ollama only
temperature = 0.4
# The checker's temperature, for both checks: 0 gives the same section the
# same verdict every time it's asked (the default, if left out).
checker_temperature = 0.0

[pipeline]
rounds = 2
# Command-line and evaluation output, inside the cases volume (privileged).
output_dir = "/data/cases/output"

[corpus]
snapshot = "v2026.09.1"
base_url = "https://oss-data-us.vaquill.ai"
# The battle-law volume.
data_dir = "/data/law"
jurisdictions = ["ut", "ca", "tx", "ak", "federal"]
document_types = ["statutes", "constitutions", "court_rules"]

[search]
# Semantic search alongside keyword search: on since 2026-10-16. The vectors
# are in the battle-law volume next to the index (/data/law/law-vectors*),
# and the weekly `corpus refresh` re-embeds only new and changed sections.
# If they're ever missing or behind the index, cases fall back to keyword
# search with a warning in the app log.
semantic = true
# Must be the model that built the vectors. Runs on the server's Ollama
# (the [ollama] url), next to the drafting model: 274 MB of the 16 GB card.
embedding_model = "nomic-embed-text"

[bedrock]
# Oregon. gpt-oss 120B is called by its regional model ID, not a "us."
# inference profile, so its calls stay in us-west-2.
region = "us-west-2"
# No profile: the live site uses a Bedrock API key, mounted from the server
# as a Docker secret (docker-compose.yml). The key never goes in this file.
api_key_file = "/run/secrets/bedrock_api_key"
max_tokens = 16000
timeout_seconds = 600

# As in config.bedrock.toml. Keep the two in step.
[bedrock.models.gpt-oss-120b]
id = "openai.gpt-oss-120b-1:0"
# On demand in us-west-2, checked 2026-11-05.
input_per_million = 0.15
output_per_million = 0.60

[web]
# 0.0.0.0 inside the container. No port is published on the host: only Caddy,
# on smark_iq's Docker network, can reach it. Allowed only because
# behind_proxy and secure_cookies are both true.
host = "0.0.0.0"
port = 8000
# The battle-cases volume: accounts and case files.
data_dir = "/data/cases"
secure_cookies = true
behind_proxy = true
retention_days = 90
# How many cases one user may have waiting or running at once, so one person
# can't fill the queue. 0 = no cap.
max_active_cases = 3
# How many cases run at once. On Bedrock there's no GPU to wait for (search
# still uses the server's embedding model, which is quick). Kept at 2 for the
# beta: the container's 3 GB memory limit hasn't been tried with more.
workers = 2
# Where users reach the site, for the one-time setup links the admin command
# prints.
public_url = "https://battle.smarkiq.us"

[plans]
# The service packages accounts are sold (see plans/profitability-plan.md),
# as the number of cases an account may start. Set an account's plan with
# `python -m battle_test.web.users plan NAME PLAN`. Runs that fail aren't
# counted. An account with no plan, or one removed from here, gets `default`.
default = "trial"

[plans.trial]
label = "Trial"
cases = 5
period = "total"    # never renews

[plans.beta]
# The lawyers' beta (decided 2026-11-20): 15 cases in total, for 60 days.
# The 60 days is the paid-through date, set when the account is made:
# `python -m battle_test.web.users beta NAME... --days 60`. Cost: about $0.05
# a case on Bedrock, so at most about $0.90 per tester (plans/beta-plan.md).
label = "Beta"
cases = 15
period = "total"

[plans.solo]
label = "Solo"
cases = 30
period = "month"    # renews on the 1st

[plans.pro]
label = "Pro"
cases = 100
period = "month"

[plans.firm]
label = "Firm"
cases = 60          # per seat. Seats in the same firm (users firm NAME FIRM) share the total.
period = "month"

[plans.unlimited]
label = "Unlimited"  # no "cases": no limit. For admins and internal testing.
