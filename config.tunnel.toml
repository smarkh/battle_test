# battle_test configuration for running on the laptop with the models on the
# smark_iq server. Used only with `--config config.tunnel.toml`. The law index
# and the search stay on the laptop; only the model calls go to the server,
# so the laptop needs little memory. Open the tunnel first, in its own window:
#
#   ssh -N -L 11435:127.0.0.1:11434 smark@smark-iq

[ollama]
# The laptop's end of the tunnel. 127.0.0.1, not localhost: Windows tries IPv6
# first for localhost, and each call then waits about 2 s.
url = "http://127.0.0.1:11435"
timeout_seconds = 1800
# The server's GPU is shared with smark_iq's Open WebUI, so unload the model
# 30 s after the last request, as config.server.toml does.
keep_alive = "30s"

[models]
provider = "ollama"
# The live site's model. The server also has qwen2.5:7b (`--model qwen2.5:7b`).
plaintiff = "qwen2.5:14b"
defendant = "qwen2.5:14b"
# Checks whether each cited section says what the draft cites it for
# (plans/plan.md, 3a). A 7B judging its own citations isn't reliable, so
# this is the 14B. Leave it out to skip the check. It's also asked,
# before drafting, whether each selected section fits the case at all
# (`fit_check = false` under [pipeline] turns that part off).
checker = "qwen2.5:14b"

[generation]
num_ctx = 12288
temperature = 0.4
# The checker's temperature, for both checks: 0 gives the same section the
# same verdict every time it's asked (the default, if left out).
checker_temperature = 0.0

[pipeline]
rounds = 2
output_dir = "output"

[corpus]
snapshot = "v2026.09.1"
base_url = "https://oss-data-us.vaquill.ai"
data_dir = "data"
jurisdictions = ["ut", "ca", "tx", "ak", "federal"]
document_types = ["statutes", "constitutions", "court_rules"]

[search]
# On here and off in config.toml: evaluated 2026-10-10, it finds more law but
# the briefs cite no more yet (plans/plan.md, 3b). The embedding model is on
# the laptop (the vectors were built with it there), so it keeps the laptop's
# Ollama.
semantic = true
embedding_model = "nomic-embed-text"
embedding_url = "http://127.0.0.1:11434"

[web]
# The web UI on the laptop with the server's models, to see what the checks
# look like on a results page before turning them on for the live site:
#   .venv\Scripts\python -m battle_test.web --config config.tunnel.toml
# The laptop's own accounts (same data_dir as config.toml). Port 8001, since
# 8000 is the server tunnel's (plans/plan.md, mode B). Local only.
host = "127.0.0.1"
port = 8001
data_dir = "cases/web"
secure_cookies = false
behind_proxy = false
retention_days = 90
max_active_cases = 3

[plans]
default = "unlimited"

[plans.unlimited]
label = "Unlimited"