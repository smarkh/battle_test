# battle_test configuration. When the project moves to the smark_iq server,
# only this file should need to change.

[ollama]
url = "http://localhost:11434"
timeout_seconds = 1800

[models]
# "ollama" (models on this machine) or "bedrock" (hosted, see
# config.bedrock.toml and plans/aws-bedrock-plan.md).
provider = "ollama"
# Same model for both roles on the dev laptop; try different models per role
# once on the server.
plaintiff = "qwen2.5:7b"
defendant = "qwen2.5:7b"

[generation]
# Ollama's default context is too small to hold complaint + motion +
# opposition + quoted statutes, and it truncates silently, so set it
# explicitly.
num_ctx = 12288
temperature = 0.4

[pipeline]
# 1 = complaint, motion, opposition. 2 = also the plaintiff's reply.
rounds = 2
output_dir = "output"

[corpus]
# Open US Law snapshot (https://www.vaquill.ai/open-us-law), CC BY 4.0.
# Refreshed quarterly: bump the version and rebuild to update.
snapshot = "v2026.08"
base_url = "https://oss-data-us.vaquill.ai"
data_dir = "data"
jurisdictions = ["ut", "ca", "tx", "federal"]
# Federal regulations (~2.8 GB) are left out for now; add "regulations" to
# include them.
document_types = ["statutes", "constitutions", "court_rules"]

[search]
# Semantic search finds sections by meaning as well as by keyword. It needs
# the section vectors, built once per law snapshot with
# `python -m battle_test.corpus embed` (slow), and the embedding model in
# Ollama (`ollama pull <model>`). Off until the vectors are built.
semantic = false
# The model that built the vectors must also embed the queries. Changing it
# means running `corpus embed` again.
embedding_model = "nomic-embed-text"
# Where that model runs. Left out: the [ollama] url above.
# embedding_url = "http://localhost:11434"

[web]
# Part 1 of the web UI has no login yet, so it must stay on this machine:
# the server refuses any host other than 127.0.0.1 / localhost.
host = "127.0.0.1"
port = 8000
# Case inputs and results, and the accounts database. Under cases/, which is
# gitignored: they may hold privileged material.
data_dir = "cases/web"
# Send the sign-in cookie only over HTTPS. Must be true once deployed behind
# Caddy + Cloudflare; false only works for http://127.0.0.1 on this machine.
secure_cookies = false
# True only in the server's config (config.server.toml): served through Caddy
# + Cloudflare. A host other than 127.0.0.1/localhost is refused unless both
# this and secure_cookies are true.
behind_proxy = false
# Finished and failed cases (inputs and results) are deleted automatically
# this many days after they were created. 0 keeps them until deleted by hand.
retention_days = 90
# How many cases one user may have waiting or running at once. Runs go one
# at a time, so this stops one person filling the queue. 0 = no cap.
max_active_cases = 3
# Where users reach the site, for the one-time setup links the admin command
# prints. Left out here: the laptop uses http://host:port.

[plans]
# The service packages accounts are sold (see plans/profitability-plan.md),
# as the number of cases an account may start. Set an account's plan with
# `python -m battle_test.web.users plan NAME PLAN`. Runs that fail aren't
# counted. An account with no plan, or one removed from here, gets `default`.
default = "trial"

[plans.trial]
label = "Trial"
cases = 5
period = "total"    # never renews

[plans.solo]
label = "Solo"
cases = 30
period = "month"    # renews on the 1st

[plans.pro]
label = "Pro"
cases = 100
period = "month"

[plans.firm]
label = "Firm"
cases = 60          # per seat. Seats in the same firm (users firm NAME FIRM) share the total.
period = "month"

[plans.unlimited]
label = "Unlimited"  # no "cases": no limit. For admins and internal testing.
